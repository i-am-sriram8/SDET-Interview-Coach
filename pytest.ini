#   How do you stop a typo like @pytest.mark.smok from silently passing?” Register markers in pytest.ini and 
#   use --strict-markers, so unknown markers raise an error.

markers = 
    smoke: quick critical checks
    regression: full suite
addopts = --strict-markers

#   Run subsets with 
#   pytest -m smoke 
#   pytest -m "regression and not smoke"
#   Built-ins: skips, skipif, xfail(an expected failure with a known defect)
